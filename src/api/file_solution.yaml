type: file
example: "resources_test/task_spatial_trajectory_inference/cxg_mouse_pancreas_atlas/solution.h5ad"
label: "Solution"
summary: "The solution (ground truth) for the test data"
info:
  format:
    type: h5ad
    layers:
      - type: integer
        name: counts
        description: Raw counts
        required: true
    obs:
      - type: string
        name: cell_type
        description: Cell type information
        required: true
      - type: string
        name: batch
        description: Batch information
        required: true
      - type: double
        name: pseudotime_true
        description: Ground truth pseudotime for each cell/spot.
        required: true
    obsm:
      - type: double
        name: X_spatial
        description: Spatial coordinates of each cell/spot.
        required: true
    uns:
      - type: string
        name: dataset_id
        description: "A unique identifier for the dataset"
        required: true
      - name: dataset_name
        type: string
        description: Nicely formatted name.
        required: true
      - type: string
        name: dataset_url
        description: Link to the original source of the dataset.
        required: false
      - name: dataset_reference
        type: string
        description: Bibtex reference of the paper in which the dataset was published.
        required: false
      - name: dataset_summary
        type: string
        description: Short description of the dataset.
        required: true
      - name: dataset_description
        type: string
        description: Long description of the dataset.
        required: true
      - name: dataset_organism
        type: string
        description: The organism of the sample in the dataset.
        required: false
      - type: string
        name: normalization_id
        description: "Which normalization was used"
        required: true
      - type: dataframe
        name: marker_genes
        description: "Marker genes per biological state, with expected ordering along the trajectory (columns: gene_name, biological_state, expected_order). Used by marker-based metrics when provided."
        required: false
